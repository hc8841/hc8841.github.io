<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uma pergunta para Bruna 💗</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --pink: #ff4f91;
      --pink-dark: #e92f73;
      --pink-light: #fff0f6;
      --rose: #ff8fba;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.8) 0 3px, transparent 4px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,.7) 0 4px, transparent 5px),
        linear-gradient(135deg, #ffd6e7 0%, #fff0f6 45%, #ffc2d9 100%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #6b2445;
    }

    .heart {
      position: fixed;
      color: rgba(255, 79, 145, .22);
      animation: float 7s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes float {
      from { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      15% { opacity: 1; }
      to { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
    }

    .main-card {
      position: relative;
      z-index: 2;
      width: min(92vw, 650px);
      border: 0;
      border-radius: 30px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 25px 80px rgba(190, 49, 105, .25);
      backdrop-filter: blur(12px);
    }

    .heart-big {
      width: 85px;
      height: 85px;
      margin: 0 auto 15px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), #ff79aa);
      color: white;
      font-size: 42px;
      box-shadow: 0 12px 30px rgba(255, 79, 145, .35);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    h1 {
      color: var(--pink-dark);
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .subtitle {
      color: #8d4d69;
      font-size: 1.1rem;
    }

    .question {
      font-size: clamp(1.45rem, 4vw, 2rem);
      font-weight: 700;
      margin: 28px 0 25px;
    }

    .buttons-area {
      position: relative;
      min-height: 125px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 15px;
    }

    .btn-love, .btn-no {
      border: 0;
      border-radius: 999px;
      padding: 13px 30px;
      font-size: 1.08rem;
      font-weight: 700;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .btn-love {
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: white;
      box-shadow: 0 8px 22px rgba(233,47,115,.3);
    }

    .btn-love:hover {
      color: white;
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 12px 28px rgba(233,47,115,.4);
    }

    .btn-no {
      background: #f4d9e4;
      color: #91415f;
    }

    .btn-no:hover {
      background: #efd0dd;
    }

    .runaway {
      position: absolute !important;
      z-index: 10;
    }

    .result {
      display: none;
      animation: appear .7s ease;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(.85); }
      to { opacity: 1; transform: scale(1); }
    }

    .result i {
      font-size: 4.5rem;
      color: var(--pink);
    }

    .result h2 {
      color: var(--pink-dark);
      font-weight: 800;
    }

    .counter {
      font-size: .85rem;
      color: #b06b87;
      margin-top: 12px;
    }

    .footer {
      color: #ad6681;
      font-size: .8rem;
    }

    @media (max-width: 500px) {
      .main-card { border-radius: 24px; }
      .buttons-area { min-height: 145px; }
      .btn-love, .btn-no { padding: 12px 22px; }
    }
  </style>
</head>

<body>
  <!-- Floating hearts -->
  <div class="heart" style="left:5%; animation-delay:0s; font-size:24px;">♥</div>
  <div class="heart" style="left:18%; animation-delay:2s; font-size:17px;">♥</div>
  <div class="heart" style="left:35%; animation-delay:4s; font-size:30px;">♥</div>
  <div class="heart" style="left:58%; animation-delay:1s; font-size:20px;">♥</div>
  <div class="heart" style="left:76%; animation-delay:3s; font-size:32px;">♥</div>
  <div class="heart" style="left:91%; animation-delay:5s; font-size:18px;">♥</div>

  <main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <section class="main-card card p-4 p-md-5 text-center">
      <div id="questionScreen">
        <div class="heart-big">
          <i class="bi bi-heart-fill"></i>
        </div>

        <h1>Bruna 💗</h1>
        <p class="subtitle mb-0">
          Eu tenho uma pergunta muito importante para fazer...
        </p>

        <div class="question">
          Você quer namorar comigo? 🥺👉👈
        </div>

        <div class="buttons-area" id="buttonsArea">
          <button id="yesBtn" class="btn btn-love">
            <i class="bi bi-heart-fill me-2"></i>SIM!
          </button>

          <button id="noBtn" class="btn btn-no">
            Não 😔
          </button>
        </div>

        <div id="counter" class="counter"></div>
      </div>

      <div id="resultScreen" class="result">
        <i class="bi bi-hearts"></i>
        <h2 class="mt-3">EU SABIA! 😭💗</h2>
        <p class="fs-5">
          Então agora é oficial, Bruna!<br>
          <strong>Você é minha namorada. ❤️</strong>
        </p>
        <div class="fs-1 mt-3">🥰 💕 🫶 💗</div>
      </div>

      <div class="footer mt-4">
        Feito com carinho (e uma quantidade suspeita de JavaScript) 😌
      </div>
    </section>
  </main>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    $(function () {
      let attempts = 0;

      function moveNoButton() {
        const $area = $('#buttonsArea');
        const $button = $('#noBtn');

        attempts++;

        // Transforma o botão em absoluto na primeira fuga.
        $button.addClass('runaway');

        const areaWidth = $area.innerWidth();
        const areaHeight = $area.innerHeight();
        const buttonWidth = $button.outerWidth();
        const buttonHeight = $button.outerHeight();

        // Mantém o botão dentro da área.
        const maxX = Math.max(0, areaWidth - buttonWidth);
        const maxY = Math.max(0, areaHeight - buttonHeight);

        let x = Math.random() * maxX;
        let y = Math.random() * maxY;

        // Evita ficar exatamente em cima do SIM.
        if (attempts < 3 && x < areaWidth / 2) {
          x = Math.min(maxX, areaWidth * .55 + Math.random() * (maxX * .4));
        }

        $button.css({
          left: x + 'px',
          top: y + 'px'
        });

        const messages = [
          'Tem certeza? 👀',
          'Esse botão parece estar com medo kkkkk',
          'Você não vai conseguir clicar no Não 😂',
          'Bruna, olha o SIM ali... 👀❤️',
          'O botão NÃO pediu demissão. 😭',
          'Aceita logo, mulher! kkkkk 💗'
        ];

        $('#counter').text(messages[Math.min(attempts - 1, messages.length - 1)]);
      }

      $('#noBtn').on('mouseenter touchstart click', function (e) {
        e.preventDefault();
        moveNoButton();
      });

      $('#yesBtn').on('click', function () {
        $('#questionScreen').fadeOut(350, function () {
          $('#resultScreen').fadeIn(500);
        });

        // Pequena chuva de corações.
        for (let i = 0; i < 25; i++) {
          const $heart = $('<span class="heart">♥</span>');
          $heart.css({
            left: Math.random() * 100 + '%',
            animationDelay: Math.random() * 2 + 's',
            fontSize: (14 + Math.random() * 25) + 'px'
          });
          $('body').append($heart);

          setTimeout(() => $heart.remove(), 7500);
        }
      });
    });
  </script>
</body>
</html>
